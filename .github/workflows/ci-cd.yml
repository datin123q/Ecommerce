name: Commerce Core CI/CD

on:
  push:
    branches: ["Main", "master"]
  pull_request:
    branches: ["Main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      JWT_ACCESS_SECRET: "dummy_access"
      JWT_REFRESH_SECRET: "dummy_refresh"
      STRIPE_SECRET_KEY: "dummy_stripe"
      STRIPE_WEBHOOK_SECRET: "dummy_webhook"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dummy
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dummy -d dummy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kéo source code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit Test
        run: npm run test

      - name: E2E Test
        run: npm run test:e2e