name: Commerce Core CI/CD

# Kích hoạt khi có code mới đẩy lên nhánh main
on:
  push:
    branches: [ "Main", "master" ]
  pull_request:
    branches: [ "Main", "master" ]

jobs:
  # --- GIAI ĐOẠN 1: KIỂM TRA & BIÊN DỊCH ---
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      JWT_ACCESS_SECRET: "dummy_access"
      JWT_REFRESH_SECRET: "dummy_refresh"
      STRIPE_SECRET_KEY: "dummy_stripe"
      STRIPE_WEBHOOK_SECRET: "dummy_webhook"
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name:  Kéo source code về máy chủ GitHub
        uses: actions/checkout@v3

      - name:  Cài đặt Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm' # Giúp cài đặt nhanh hơn ở các lần sau

      - name:  Cài đặt thư viện (Chuẩn môi trường sạch)
        run: npm ci

      - name:  Sinh code cho Prisma Client
        run: npx prisma generate

      - name:  Biên dịch dự án (Build)
        run: npm run build

      # - name:  Chạy kiểm thử tự động (Unit & E2E)
      #   run: |
      #     npm run test

