services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce_core_postgres
    restart: always
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: commerce_core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commerce_core_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Thêm lại Nginx vào đây
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - postgres
      - redis
  prometheus:
    image: prom/prometheus
    container_name: commerce_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres
      - redis

  grafana:
    image: grafana/grafana
    container_name: commerce_grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: