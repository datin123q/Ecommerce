services:
  postgres_master:
    image: bitnami/postgresql:latest
    container_name: commerce_core_postgres_master
    restart: always
    environment:
      POSTGRESQL_USERNAME: root
      POSTGRESQL_PASSWORD: rootpassword
      POSTGRESQL_DATABASE: commerce_core_db
      POSTGRESQL_POSTGRES_PASSWORD: password
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replpassword
      POSTGRESQL_MAX_CONNECTIONS: 200
    ports:
      - "5432:5432" 
    volumes:
      - postgres_master_data:/bitnami/postgresql

  postgres_replica:
    image: bitnami/postgresql:latest
    container_name: commerce_core_postgres_replica
    restart: always
    depends_on:
      - postgres_master
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres_master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replpassword
      POSTGRESQL_PASSWORD: rootpassword
      POSTGRESQL_MAX_CONNECTIONS: 200
    ports:
      - "5433:5432" 
    volumes:
      - postgres_replica_data:/bitnami/postgresql

  redis:
    image: redis:7-alpine
    container_name: commerce_core_redis
    restart: always
    ports:
      - "6379:6379"

  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    ports:
      - "6371:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_1:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.11

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    ports:
      - "6372:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_2:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.12

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    ports:
      - "6373:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_3:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.13

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    ports:
      - "6374:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_4:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.14

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    ports:
      - "6375:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_5:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.15

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    ports:
      - "6376:6379"
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis_data_6:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.25.0.16

  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - redis_cluster_net
    command: >
      sh -c "
        echo 'Dang cho cac node khoi dong...' &&
        sleep 5 &&
        IP1=$$(ping -c 1 redis-node-1 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        IP2=$$(ping -c 1 redis-node-2 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        IP3=$$(ping -c 1 redis-node-3 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        IP4=$$(ping -c 1 redis-node-4 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        IP5=$$(ping -c 1 redis-node-5 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        IP6=$$(ping -c 1 redis-node-6 | grep PING | cut -d '(' -f2 | cut -d ')' -f1) &&
        redis-cli --cluster create $$IP1:6379 $$IP2:6379 $$IP3:6379 $$IP4:6379 $$IP5:6379 $$IP6:6379 --cluster-replicas 1 --cluster-yes
      "

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - postgres_master
      - postgres_replica
      - redis

  prometheus:
    image: prom/prometheus
    container_name: commerce_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres_master
      - redis

  grafana:
    image: grafana/grafana
    container_name: commerce_grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  redis-insight:
    image: redis/redisinsight:latest
    container_name: commerce_redis_insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis-node-1
    networks:
      - redis_cluster_net

networks:
  redis_cluster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  prometheus_data:
  grafana_data:
  redis_data_1:
  redis_data_2:
  redis_data_3:
  redis_data_4:
  redis_data_5:
  redis_data_6:
