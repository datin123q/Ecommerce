version: '3.8'

services:
  # --- HẠ TẦNG CỦA BẠN ---
  postgres:
    image: postgres:16-alpine
    container_name: commerce_core_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: commerce_core_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commerce_core_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # --- HỆ THỐNG SCALE OUT ---
  
  # 1. Load Balancer (Đứng ngoài cùng)
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_1
      - api_2

  # 2. NestJS Instance 1
  api_1:
    build: .
    restart: always
    environment:
      # Sửa localhost thành tên service (postgres và redis)
      DATABASE_URL: postgresql://root:rootpassword@postgres:5432/commerce_core_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  # 3. NestJS Instance 2
  api_2:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://root:rootpassword@postgres:5432/commerce_core_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local