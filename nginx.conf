events { worker_connections 1024; }

http {
    # 1. Giới hạn tần suất request (Rate Limiting)
    # Tạo một vùng nhớ zone 10MB, cho phép trung bình 10 request/giây mỗi IP.
    # burst=20: Cho phép vượt quá tối đa 20 request (xếp hàng chờ xử lý thay vì báo lỗi ngay).
    # nodelay: Xử lý ngay lập tức các request trong vùng burst nếu chưa vượt quá hạn mức.
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    # 2. Giới hạn số lượng kết nối đồng thời (Connection Limiting)
    # Tạo vùng nhớ zone 10MB để đếm số kết nối đồng thời từ một IP.
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Định nghĩa cụm server backend
    upstream nestjs_cluster {

        least_conn;

        server api_1:3000;
        server api_2:3000;
    }

    server {
        listen 80;
        # Áp dụng giới hạn số kết nối đồng thời tối đa cho mỗi IP (ví dụ: tối đa 20 kết nối cùng lúc)
        limit_conn conn_limit_per_ip 20;

        location / {
            # Áp dụng giới hạn tần suất request chống DDoS/Brute-force
            limit_req zone=req_limit_per_ip burst=20 nodelay;

            proxy_pass http://nestjs_cluster;

            # Giữ nguyên IP thật của người dùng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Hỗ trợ WebSockets 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Tối ưu hóa proxy kết nối lại backend
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}